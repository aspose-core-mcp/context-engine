services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: adcs-api:local
    mem_limit: 4g
    volumes:
    - ./source-repo-apiref:/app/source-repo-apiref:ro
    - ./source-repo-docs:/app/source-repo-docs:ro
    - ./artifacts:/app/artifacts
    env_file:
    - ${ADCS_COMPOSE_ENV_FILE:-.env.compose.example}
    ports:
    - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: adcs-worker:local
    mem_limit: ${ADCS_WORKER_MEM_LIMIT:-24g}
    volumes:
    - ./source-repo-apiref:/app/source-repo-apiref:ro
    - ./source-repo-docs:/app/source-repo-docs:ro
    - ./data-apiref:/app/data-apiref
    - ./data-docs:/app/data-docs
    - ./artifacts:/app/artifacts
    - ./.git:/app/.git:ro
    env_file:
    - ${ADCS_COMPOSE_ENV_FILE:-.env.compose.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    env_file:
    - ${ADCS_COMPOSE_ENV_FILE:-.env.compose.example}
    ports:
    - 127.0.0.1:15432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: valkey/valkey:8.1-alpine
    mem_limit: 256m
    command:
    - valkey-server
    - --save
    - ''
    - --appendonly
    - 'no'
    ports:
    - 6379:6379
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit vm_memory_high_watermark 0.4
    mem_limit: 512m
    ports:
    - 5672:5672
    - 15672:15672
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 15
  qdrant:
    image: qdrant/qdrant:v1.13.2
    mem_limit: 1g
    ports:
    - 6333:6333
    volumes:
    - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost:
        localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q "200 OK"'''
      interval: 10s
      timeout: 5s
      retries: 12
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    mem_limit: 1536m
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: ${OPENSEARCH_DISABLE_DEMO_CONFIG:-true}
      DISABLE_SECURITY_PLUGIN: ${OPENSEARCH_DISABLE_SECURITY:-true}
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
    - 9200:9200
    volumes:
    - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s
        > /dev/null
      interval: 15s
      timeout: 8s
      retries: 20
volumes:
  postgres_data: null
  qdrant_data: null
  opensearch_data: null
