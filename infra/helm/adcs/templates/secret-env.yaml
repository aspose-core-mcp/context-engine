apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adcs.fullname" . }}-secrets
  labels:
    {{- include "adcs.labels" . | nindent 4 }}
type: Opaque
stringData:
  # All credential-bearing values live in this Secret only. The chart's
  # values.yaml carries placeholders ("replace-me"); supply the real values at
  # install time, for example `--set-string global.secretEnv.<KEY>=...`
  # (see docs/secrets-handling.md). Never commit real values here.
  ADCS_API_KEY: {{ .Values.global.secretEnv.ADCS_API_KEY | quote }}
  POSTGRES_DSN: {{ .Values.global.secretEnv.POSTGRES_DSN | quote }}
  RABBITMQ_URL: {{ .Values.global.secretEnv.RABBITMQ_URL | quote }}
  ADCS_HASH_SECRET: {{ .Values.global.secretEnv.ADCS_HASH_SECRET | default "" | quote }}
  ADCS_EMBEDDING_API_KEY: {{ .Values.global.secretEnv.ADCS_EMBEDDING_API_KEY | default "" | quote }}
