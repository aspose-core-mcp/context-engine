{{- if .Values.mcpGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "adcs.fullname" . }}-mcp-gateway
  labels:
    {{- include "adcs.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gateway
spec:
  type: {{ .Values.mcpGateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.mcpGateway.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "adcs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gateway
{{- end }}
