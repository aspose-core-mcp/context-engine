{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "adcs.fullname" . }}
  labels:
    {{- include "adcs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "adcs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowSameNamespaceIngress }}
    - from:
        - podSelector: {}
    {{- end }}
    {{- range .Values.networkPolicy.ingressFrom }}
    - from:
        - {{ toYaml . | nindent 10 | trim }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowSameNamespaceEgress }}
    - to:
        - podSelector: {}
    {{- end }}
    {{- range .Values.networkPolicy.egressTo }}
    - to:
        {{- if .ipBlock }}
        - ipBlock:
            {{- toYaml .ipBlock | nindent 12 }}
        {{- else }}
        - namespaceSelector:
            {{- toYaml (.namespaceSelector | default dict) | nindent 12 }}
          {{- with .podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- with .ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
