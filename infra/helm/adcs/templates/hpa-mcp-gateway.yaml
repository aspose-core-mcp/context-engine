{{- if and .Values.mcpGateway.enabled .Values.mcpGateway.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "adcs.fullname" . }}-mcp-gateway
  labels:
    {{- include "adcs.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "adcs.fullname" . }}-mcp-gateway
  minReplicas: {{ .Values.mcpGateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.mcpGateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.mcpGateway.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.mcpGateway.hpa.targetMemoryUtilizationPercentage }}
{{- end }}
