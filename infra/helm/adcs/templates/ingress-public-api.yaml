{{- if and .Values.api.enabled .Values.api.ingress.public.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "adcs.fullname" . }}-public
  labels:
    {{- include "adcs.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.ingress.public.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.api.ingress.public.className }}
  ingressClassName: {{ .Values.api.ingress.public.className }}
  {{- end }}
  rules:
    - host: {{ .Values.api.ingress.public.host }}
      http:
        paths:
          {{- range .Values.api.ingress.public.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "adcs.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
  {{- with .Values.api.ingress.public.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
