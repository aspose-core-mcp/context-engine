{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "adcs.fullname" . }}-scheduler
  labels:
    {{- include "adcs.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "adcs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "adcs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "adcs.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "adcs.sourceDirs.initContainer" (dict "image" (printf "%s:%s" .Values.scheduler.image.repository .Values.scheduler.image.tag) "pullPolicy" .Values.scheduler.image.pullPolicy) | nindent 8 }}
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          command:
            - python
            - -m
            - celery
            - -A
            - adcs.worker.celery_app:celery_app
            - beat
            - --loglevel=info
          env:
            {{- include "adcs.commonEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "adcs.sourceDirs.volumeMounts" . | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from adcs.worker.celery_app import celery_app; assert celery_app.main == 'adcs-worker'"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from adcs.worker.celery_app import celery_app; assert celery_app.main == 'adcs-worker'"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      volumes:
        {{- include "adcs.sourceDirs.volume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
