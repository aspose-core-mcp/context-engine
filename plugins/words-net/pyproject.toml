[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adcs-words-net-extractor"
version = "0.1.0"
requires-python = ">=3.12"
description = "Independent Aspose.Words .NET extraction worker"
dependencies = []

[project.scripts]
adcs-words-net-extract = "adcs_words_net.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
