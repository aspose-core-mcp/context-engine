# Golden queries for live API acceptance evaluation.
# Each case targets a specific retrieval mode (task, symbol, migration)
# and asserts relevance, citation coverage, version accuracy, and latency.
#
# Schema per case:
#   case_id            — unique stable identifier
#   query              — natural-language or symbol query text
#   product_id         — canonical product id (e.g. aspose.ocr)
#   language           — programming language key (net, java, cpp, python-net, ...)
#   version            — target version (null = latest-stable)
#   expected_mode      — expected retrieval mode: task | symbol | migration
#   strict_version     — enforce version isolation (default true)
#   top_k              — number of results to request (default 5)
#   expected_keywords  — keywords that MUST appear in at least one top-k excerpt
#   expected_urls      — canonical URLs that SHOULD appear in top-k results
#   endpoint           — REST endpoint to call: query_docs | get_symbol_doc
#
# Thresholds:
#   relevance         >= 80%   (at least one top-k result matches expected)
#   p95 latency       <= 1200ms
#   citation_coverage  = 100%  (every result has canonical_url + section_anchor)
#   version_accuracy  >= 95%   (no cross-version leakage under strict_version)

dataset_id: adcs-live-golden-v1
description: Curated golden queries for live API acceptance testing

cases:
  # ── Aspose.OCR task queries ────────────────────────────────────────────
  - case_id: LIVE-OCR-TASK-001
    query: "How to recognize text from an image in C#?"
    product_id: aspose.ocr
    language: net
    version: null
    expected_mode: task
    strict_version: false
    top_k: 5
    endpoint: query_docs
    expected_keywords:
      - RecognizeImage
      - image
    expected_urls:
      - "https://docs.aspose.com/ocr/net/recognition/"

