layout_semantics_reference:
  description: Canonical semantics used by layout_detection.layout_type and dimensions.
  tokens:
    doc_locale: Natural language locale dimension for documentation content (for example
      english, german, ru).
    programming_language: SDK/runtime language dimension (for example net, java, cpp,
      python).
    namespace: API namespace/class path dimension, mainly for API reference repositories.
    content_group: Documentation structure grouping (for example getting-started,
      developer-reference).
    auxiliary_content_group: Non-SDK top-level content group that should not be treated
      as programming language.
